name: Python Tests
 
# Запуск при каждом push в основную ветку и при создании/обновлении pull request
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
 
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Секрет для уведомлений в Slack (необязателен: без него шаг уведомления пропускается)
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
 
    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v4
 
      - name: Установить Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
 
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
 
      - name: Запустить тесты
        run: pytest -v
 
      - name: Уведомление в Slack
        if: ${{ always() && env.SLACK_WEBHOOK != '' }}
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "Тесты (Python ${{ matrix.python-version }}) в ${{ github.repository }}: ${{ job.status }}. Запуск: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
